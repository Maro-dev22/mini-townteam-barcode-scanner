<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINI TOWNTEAM - Barcode Scanner</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/camera.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="container">

    <header>
      <img src="town.jpeg" alt="MINI TOWNTEAM Logo" class="logo">
      <h1>Barcode Picker</h1>

<p class="version">Version 2.3</p>
    </header>
<section class="card">

    <h2>Upload Mission File</h2>

    <input
         type="file"
         id="missionFile"
         accept=".xlsx,.xls">

</section>
    <!-- Scanner -->
    <section class="card">

      <button id="scanBtn">
        📷 Scan Item
      </button>

      <input
        type="text"
        id="barcodeInput"
        placeholder="Scan or Enter Barcode"
        autocomplete="off">

      

    </section>

    <!-- Dashboard & Progress -->
    <section class="card dashboard">
      <h2>Dashboard & Progress</h2>
      
      <div class="progress-wrapper">
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div class="progress-stats">
          <span id="remainingCounter">Remaining: 0</span>
          <span id="totalCounter">Total: 0</span>
        </div>
      </div>

      <div class="last-scanned">
        <h3>Last Scanned</h3>
        <p id="lastScannedItem">-----</p>
      </div>
    </section>
    <!-- Product Details -->
    <section class="card details">

     <h3>Item Code</h3>
     <p id="itemCodeValue">-----</p>

      <h3>Color</h3>
      <p id="colorValue">-----</p>

      <h3>Size</h3>
      <p id="sizeValue">-----</p>

      <h3>Status</h3>
      <p id="status">🟡 Ready</p>

      <h3>Collected</h3>
      <p id="counter">0 / 0</p>

    </section>

<div id="optionsBox" style="display:none; margin-top:20px;">

    <h3>Choose Color</h3>
    <div id="colorOptions"></div>

    <h3 style="margin-top:20px;">Choose Size</h3>
    <div id="sizeOptions"></div>
    <button id="confirmBtn" style="display:none;">
    ✅ Confirm Selection
</button>

</div>

    <section class="card" style="margin-top: 20px;">
        <button id="exportBtn" style="background-color: #007bff; color: white;">
            📥 Export File 
        </button>
    </section>
  </div>
<!-- Camera Overlay -->
<div id="cameraOverlay" class="camera-overlay">

  <div class="camera-container">

    <h2>📷 Scan Barcode</h2>

  <div id="reader"></div>
  
 <div class="scan-frame">
    <div class="scan-line"></div>
</div>

    <p class="camera-text">
      Place barcode inside the frame
    </p>

    <button id="closeCameraBtn">
      ✖ Close
    </button>

  </div>

</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.4.3000/dist/dbr.bundle.js"></script>

<script src="js/excel.js"></script>
<script src="js/ui.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
</body>

</html>
